# Optional overrides. Delete any block to accept the defaults.

tolerance:
  # A candidate is rejected if any task drops from pass to fail in more than this
  # many runs out of N.
  max_task_regression_runs: 1
  # Set true to reject any new failure at all on a task that passed cleanly.
  no_new_failures: false

cost:
  # Fallback per-run estimate, used until a baseline has measured the real cost.
  estimate_usd_per_run: 0.10
  # Projected spend above this requires --yes.
  ceiling_usd: 5.00

worktree:
  # Untracked files git will not carry into a disposable worktree but that the
  # eval assertions need (e.g. local credentials).
  copy_paths: []
    # - .env
