[project]
name = "crate"
version = "0.1.0"
description = "A CLI agent that builds Spotify playlists the way an obsessive human curator would - trust networks of diggers, labels, and DJs, never similarity scores."
readme = "README.md"
authors = [
    { name = "Michael Pawlus", email = "michaelpawlus.osu@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
api = ["anthropic>=0.40"]

[project.scripts]
crate = "crate.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"
